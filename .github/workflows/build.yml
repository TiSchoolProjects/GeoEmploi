name: build
run-name: build
on: 
  push:
    branches: [main]
jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Repository checkout
          uses: actions/checkout@v4

        - name: Backend .env copy 
          working-directory: backend 
          run: |
            cp .env.example .env

        - name: start service
          run: |
            mkdir -p artifact/backend
            mkdir -p artifact/frontend
            cp -r backend/dist artifact/backend/dist
            cp backend/package.json backend/package-lock.json artifact/backend/
            cp -r frontend/dist artifact/frontend/dist

        - name: launch docker
          run: docker compose up --build -d

        - name: Clean and Upload
          if: success()
          uses: actions/upload-artifact@v4
          with:
            name: docker-artifact
            path: .
            include-hiden-files: true


